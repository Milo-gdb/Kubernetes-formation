apiVersion: v1
kind: Pod
metadata:
  name: serveur
  namespace: td-10
  labels: { role: serveur }
spec:
  containers:
    - name: nginx
      image: nginx:1.30-alpine
      ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: serveur
  namespace: td-10
spec:
  selector: { role: serveur }
  ports: [{ port: 80 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: autorise
  namespace: td-10
  labels: { acces: oui }
spec:
  containers:
    - name: busybox
      image: busybox:1.37
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: intrus
  namespace: td-10
spec:
  containers:
    - name: busybox
      image: busybox:1.37
      command: ["sleep", "3600"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: serveur-restreint
  namespace: td-10
spec:
  podSelector:
    matchLabels: { role: serveur }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { acces: oui }
      ports:
        - port: 80
