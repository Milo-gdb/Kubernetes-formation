apiVersion: v1
kind: Namespace
metadata:
  name: td-10
  labels:
    equipe: formation
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: td-10
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 512Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limites
  namespace: td-10
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 32Mi }
      default: { memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remplissage
  namespace: td-10
spec:
  replicas: 3
  selector:
    matchLabels: { app: remplissage }
  template:
    metadata:
      labels: { app: remplissage }
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lecteur
  namespace: td-10
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lecture
  namespace: td-10
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lecteur-lecture
  namespace: td-10
subjects:
  - kind: ServiceAccount
    name: lecteur
    namespace: td-10
roleRef:
  kind: Role
  name: lecture
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployeur
  namespace: td-10
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployeur-edit
  namespace: td-10
subjects:
  - kind: ServiceAccount
    name: deployeur
    namespace: td-10
roleRef:
  kind: ClusterRole          # ClusterRole prédéfini, mais accordé dans td-10 seulement
  name: edit
  apiGroup: rbac.authorization.k8s.io
