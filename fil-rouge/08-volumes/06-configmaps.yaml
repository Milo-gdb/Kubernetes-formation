# Configuration non sensible de l'API PostgREST (injectée en variables d'environnement)
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: task-manager
  labels:
    app.kubernetes.io/part-of: task-manager
data:
  PGRST_DB_SCHEMAS: public
  PGRST_DB_ANON_ROLE: web_anon
  PGRST_LOG_LEVEL: info
  PGRST_ADMIN_SERVER_PORT: "3001"   # expose /live et /ready pour les sondes
---
# Script SQL exécuté au premier démarrage de PostgreSQL (base vide uniquement)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: task-manager
  labels:
    app.kubernetes.io/part-of: task-manager
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS tasks (
      id         serial PRIMARY KEY,
      title      text        NOT NULL,
      done       boolean     NOT NULL DEFAULT false,
      created_at timestamptz NOT NULL DEFAULT now()
    );
    -- Rôle utilisé par PostgREST pour les requêtes anonymes
    CREATE ROLE web_anon NOLOGIN;
    GRANT USAGE ON SCHEMA public TO web_anon;
    GRANT SELECT, INSERT, UPDATE, DELETE ON tasks TO web_anon;
    GRANT USAGE, SELECT ON SEQUENCE tasks_id_seq TO web_anon;
    INSERT INTO tasks (title) VALUES
      ('Découvrir les Pods'),
      ('Écrire un Deployment'),
      ('Exposer l''application avec un Service');
---
# Configuration nginx : sert les fichiers statiques et relaie /api/ vers l'API (reverse proxy)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: task-manager
  labels:
    app.kubernetes.io/part-of: task-manager
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }
    }
---
# Page web du frontend (HTML + JavaScript qui appelle /api/tasks)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: task-manager
  labels:
    app.kubernetes.io/part-of: task-manager
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="fr">
    <head>
      <meta charset="utf-8">
      <title>Task Manager — Formation Kubernetes</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; color: #222; }
        h1 { color: #326ce5; }
        li { padding: .3rem 0; }
        li.done span { text-decoration: line-through; color: #888; }
        button { margin-left: .5rem; }
        #err { color: #c00; }
      </style>
    </head>
    <body>
      <h1>Task Manager</h1>
      <p>Frontend nginx → API PostgREST → PostgreSQL, le tout sur Kubernetes.</p>
      <form id="form">
        <input id="title" placeholder="Nouvelle tâche" required>
        <button type="submit">Ajouter</button>
      </form>
      <p id="err"></p>
      <ul id="list"></ul>
      <script>
        const api = '/api/tasks';
        const json = { 'Content-Type': 'application/json' };
        async function charger() {
          try {
            const r = await fetch(api + '?order=id');
            if (!r.ok) throw new Error('API : HTTP ' + r.status);
            const tasks = await r.json();
            document.getElementById('err').textContent = '';
            const ul = document.getElementById('list');
            ul.innerHTML = '';
            for (const t of tasks) {
              const li = document.createElement('li');
              li.className = t.done ? 'done' : '';
              const s = document.createElement('span');
              s.textContent = t.title;
              const b1 = document.createElement('button');
              b1.textContent = t.done ? 'Rouvrir' : 'Terminer';
              b1.onclick = () => fetch(api + '?id=eq.' + t.id, { method: 'PATCH', headers: json, body: JSON.stringify({ done: !t.done }) }).then(charger);
              const b2 = document.createElement('button');
              b2.textContent = 'Supprimer';
              b2.onclick = () => fetch(api + '?id=eq.' + t.id, { method: 'DELETE' }).then(charger);
              li.append(s, b1, b2);
              ul.append(li);
            }
          } catch (e) {
            document.getElementById('err').textContent = e.message;
          }
        }
        document.getElementById('form').onsubmit = async (ev) => {
          ev.preventDefault();
          const title = document.getElementById('title').value;
          await fetch(api, { method: 'POST', headers: json, body: JSON.stringify({ title }) });
          document.getElementById('title').value = '';
          charger();
        };
        charger();
      </script>
    </body>
    </html>
