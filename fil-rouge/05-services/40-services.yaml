# Frontend : NodePort pour y accéder depuis la machine (http://<IP-du-noeud>:30080)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: task-manager
  labels:
    app: frontend
    app.kubernetes.io/part-of: task-manager
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
# API : ClusterIP, uniquement joignable depuis le cluster
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: task-manager
  labels:
    app: api
    app.kubernetes.io/part-of: task-manager
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# PostgreSQL : ClusterIP, le nom DNS "postgres" est utilisé par l'API
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: task-manager
  labels:
    app: postgres
    app.kubernetes.io/part-of: task-manager
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
