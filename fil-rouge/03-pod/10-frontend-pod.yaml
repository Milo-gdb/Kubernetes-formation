# Étape 1 du fil rouge : un simple Pod nginx qui servira plus tard le frontend.
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: task-manager
  labels:
    app: frontend
    app.kubernetes.io/part-of: task-manager
spec:
  containers:
    - name: nginx
      image: nginx:1.30-alpine
      ports:
        - containerPort: 80
          name: http
