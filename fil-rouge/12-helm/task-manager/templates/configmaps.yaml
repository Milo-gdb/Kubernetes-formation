{{- $nom := include "task-manager.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $nom }}-api
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
data:
  PGRST_DB_SCHEMAS: public
  PGRST_DB_ANON_ROLE: web_anon
  PGRST_LOG_LEVEL: {{ .Values.api.logLevel | quote }}
  PGRST_SERVER_PORT: {{ .Values.api.port | quote }}
  PGRST_ADMIN_SERVER_PORT: "3001"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $nom }}-postgres-init
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
data:
  01-schema.sql: |
    {{- .Files.Get "files/01-schema.sql" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $nom }}-frontend
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- tpl (.Files.Get "files/default.conf") . | nindent 4 }}
  index.html: |
    {{- .Files.Get "files/index.html" | nindent 4 }}
