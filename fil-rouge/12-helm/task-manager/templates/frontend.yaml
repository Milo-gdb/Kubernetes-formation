{{- $nom := include "task-manager.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $nom }}-frontend
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "task-manager.selector" (dict "ctx" . "composant" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-manager.selector" (dict "ctx" . "composant" "frontend") | nindent 8 }}
      annotations:
        # Change quand la configuration change : force un rolling update.
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: config
          configMap:
            name: {{ $nom }}-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $nom }}-frontend
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "task-manager.selector" (dict "ctx" . "composant" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
