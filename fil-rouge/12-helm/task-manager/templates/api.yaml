{{- $nom := include "task-manager.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $nom }}-api
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "task-manager.selector" (dict "ctx" . "composant" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-manager.selector" (dict "ctx" . "composant" "api") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      containers:
        - name: postgrest
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
            - containerPort: 3001
              name: admin
          envFrom:
            - configMapRef:
                name: {{ $nom }}-api
            - secretRef:
                name: {{ $nom }}-api-db
          readinessProbe:
            httpGet: { path: /ready, port: admin }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: admin }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $nom }}-api
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "task-manager.selector" (dict "ctx" . "composant" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
