{{- $nom := include "task-manager.fullname" . -}}
{{- $mdp := include "task-manager.password" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nom }}-postgres
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $mdp | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nom }}-api-db
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Mot de passe hors de l'URI (libpq lit PGPASSWORD) : pas d'échappement à gérer.
  PGRST_DB_URI: {{ printf "postgres://%s@%s-postgres:5432/%s" .Values.postgres.user $nom .Values.postgres.database | quote }}
  PGPASSWORD: {{ $mdp | quote }}
