{{- if .Values.ingress.enabled -}}
{{- $nom := include "task-manager.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $nom }}
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $nom }}-frontend
                port: { name: http }
    {{- with .Values.ingress.apiHost }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $nom }}-api
                port: { name: http }
    {{- end }}
{{- end }}
