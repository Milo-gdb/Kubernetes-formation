apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-manuel          # pas de namespace : un PV est un objet du cluster
spec:
  capacity:
    storage: 100Mi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manuel
  hostPath:
    path: /tmp/pv-manuel
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-manuelle
  namespace: td-08
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manuel
  resources:
    requests:
      storage: 100Mi
