apiVersion: v1
kind: Pod
metadata:
  name: duo
  namespace: td-03
  labels:
    app: duo
spec:
  volumes:
    - name: html
      emptyDir: {}
  containers:
    - name: serveur
      image: nginx:1.30-alpine
      ports:
        - containerPort: 80
          name: http
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
    - name: horloge
      image: busybox:1.37
      command: ["sh", "-c"]
      args:
        # Le "|" est indispensable : sans lui, "Heure : ..." serait lu comme une clé YAML !
        - |
          while true; do echo "Heure : $(date)" > /html/index.html; sleep 5; done
      volumeMounts:
        - name: html
          mountPath: /html
