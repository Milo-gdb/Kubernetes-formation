apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: td-05
  labels:
    app: whoami
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          ports:
            - containerPort: 80
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: td-05
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-nodeport
  namespace: td-05
spec:
  type: NodePort
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30500
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-headless
  namespace: td-05
spec:
  clusterIP: None
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
