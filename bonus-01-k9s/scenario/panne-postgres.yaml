# Scénario du TD bonus 01 : une copie autonome du task-manager dont la base
# ne démarre pas. Ne lis pas ce fichier avant d'avoir fait le diagnostic dans k9s !
apiVersion: v1
kind: Namespace
metadata:
  name: k9s-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: k9s-lab
type: Opaque
stringData:
  POSTGRES_USER: taskmanager
  POSTGRES_PASSWORD: ChangeMe-Formation-2026
  POSTGRES_DB: taskmanager
---
apiVersion: v1
kind: Secret
metadata:
  name: api-db
  namespace: k9s-lab
type: Opaque
stringData:
  PGRST_DB_URI: postgres://taskmanager:ChangeMe-Formation-2026@postgres:5432/taskmanager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: k9s-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{ containerPort: 5432, name: postgres }]
          env:
            - name: POSTGRES_USER
              value: taskmanager
            - name: POSTGRES_DB
              value: taskmanager
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U taskmanager"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: k9s-lab
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: k9s-lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v16.5
          ports:
            - { containerPort: 3000, name: http }
            - { containerPort: 3001, name: admin }
          env:
            - { name: PGRST_DB_ANON_ROLE, value: taskmanager }
            - { name: PGRST_DB_SCHEMAS, value: public }
            - { name: PGRST_ADMIN_SERVER_PORT, value: "3001" }
          envFrom:
            - secretRef: { name: api-db }
          readinessProbe:
            httpGet: { path: /ready, port: admin }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: k9s-lab
spec:
  selector: { app: api }
  ports: [{ port: 3000, targetPort: http }]
