apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: td-11
spec:
  clusterIP: None
  selector: { app: web }
  ports: [{ port: 80, name: http }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: td-11
spec:
  serviceName: web
  replicas: 3
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      initContainers:
        - name: init-page
          image: busybox:1.37
          command: ["sh", "-c", "hostname > /www/index.html"]
          volumeMounts:
            - name: www
              mountPath: /www
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports: [{ containerPort: 80, name: http }]
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
    - metadata:
        name: www
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: td-11
spec:
  containers:
    - name: busybox
      image: busybox:1.37
      command: ["sleep", "3600"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: td-11
spec:
  selector:
    matchLabels: { app: agent }
  template:
    metadata:
      labels: { app: agent }
    spec:
      containers:
        - name: agent
          image: busybox:1.37
          env:
            - name: NOEUD
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["sh", "-c", "while true; do echo \"Agent actif sur $NOEUD\"; sleep 30; done"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lot
  namespace: td-11
spec:
  completions: 4
  parallelism: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: travail
          image: busybox:1.37
          command: ["sh", "-c", "sleep 5; echo Traitement terminé"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: echec
  namespace: td-11
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: travail
          image: busybox:1.37
          command: ["sh", "-c", "echo 'Erreur volontaire'; exit 1"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: horloge
  namespace: td-11
spec:
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: date
              image: busybox:1.37
              command: ["date"]
