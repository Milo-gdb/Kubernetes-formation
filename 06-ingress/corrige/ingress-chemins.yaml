apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chemins
  namespace: td-06
spec:
  ingressClassName: traefik
  rules:
    - host: demo.local
      http:
        paths:
          - path: /a
            pathType: Prefix
            backend:
              service: { name: app-a, port: { number: 80 } }
          - path: /b
            pathType: Prefix
            backend:
              service: { name: app-b, port: { number: 80 } }
